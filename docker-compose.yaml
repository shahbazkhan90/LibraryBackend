version: '3.8'
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: library-postgres
    environment:
      POSTGRES_USER: libadmin
      POSTGRES_PASSWORD: libpassword
      POSTGRES_DB: library_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: